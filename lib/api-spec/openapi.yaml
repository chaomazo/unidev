openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: SparkFetch — web content extraction and crawling API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scrape
    description: Single-URL content extraction
  - name: crawl
    description: Multi-page website crawling
  - name: map
    description: URL discovery

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/scrape:
    post:
      operationId: scrapeUrl
      tags: [scrape]
      summary: Scrape a URL
      description: Fetch a URL and extract its content as Markdown with metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeRequest"
      responses:
        "200":
          description: Successfully scraped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Failed to fetch URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/crawl:
    post:
      operationId: startCrawl
      tags: [crawl]
      summary: Start a crawl job
      description: Begin crawling a website recursively. Returns a job ID to poll for results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrawlRequest"
      responses:
        "202":
          description: Crawl job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlStartResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/crawl/{jobId}:
    get:
      operationId: getCrawlStatus
      tags: [crawl]
      summary: Get crawl job status
      description: Poll the status and results of a crawl job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlStatusResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/map:
    post:
      operationId: mapUrl
      tags: [map]
      summary: Map a website
      description: Discover all accessible URLs on a domain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapRequest"
      responses:
        "200":
          description: URL map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Failed to fetch URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PageMetadata:
      type: object
      properties:
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        ogTitle:
          type: string
          nullable: true
        ogDescription:
          type: string
          nullable: true
        ogImage:
          type: string
          nullable: true
        canonical:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
        publishedAt:
          type: string
          nullable: true
        url:
          type: string
        statusCode:
          type: integer
        fetchedAt:
          type: string
      required:
        - url
        - statusCode
        - fetchedAt

    ScrapeRequest:
      type: object
      properties:
        url:
          type: string
          description: The URL to scrape
        formats:
          type: array
          items:
            type: string
            enum: [markdown, html, text, links]
          default: [markdown]
          description: Output formats to include in the response
      required:
        - url

    ScrapeData:
      type: object
      properties:
        markdown:
          type: string
        html:
          type: string
        text:
          type: string
        links:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/PageMetadata"
      required:
        - metadata

    ScrapeResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/ScrapeData"
      required:
        - success
        - data

    CrawlRequest:
      type: object
      properties:
        url:
          type: string
          description: The starting URL to crawl
        maxDepth:
          type: integer
          default: 1
          minimum: 0
          maximum: 5
          description: Maximum link depth to follow
        limit:
          type: integer
          default: 10
          minimum: 1
          maximum: 50
          description: Maximum number of pages to crawl
        excludePaths:
          type: array
          items:
            type: string
          default: []
          description: URL path prefixes to skip
      required:
        - url

    CrawlStartResponse:
      type: object
      properties:
        success:
          type: boolean
        jobId:
          type: string
        status:
          type: string
        message:
          type: string
      required:
        - success
        - jobId
        - status

    CrawlPage:
      type: object
      properties:
        url:
          type: string
        markdown:
          type: string
        text:
          type: string
        links:
          type: array
          items:
            type: string
        metadata:
          type: object
          properties:
            title:
              type: string
              nullable: true
            description:
              type: string
              nullable: true
            statusCode:
              type: integer
            fetchedAt:
              type: string
          required:
            - statusCode
            - fetchedAt
      required:
        - url
        - markdown
        - text
        - links
        - metadata

    CrawlStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        jobId:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        completed:
          type: integer
        total:
          type: integer
        createdAt:
          type: string
        completedAt:
          type: string
          nullable: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/CrawlPage"
        error:
          type: string
          nullable: true
      required:
        - success
        - jobId
        - status
        - completed
        - total
        - createdAt

    MapRequest:
      type: object
      properties:
        url:
          type: string
          description: The URL to map
        limit:
          type: integer
          default: 100
          minimum: 1
          maximum: 500
      required:
        - url

    MapResponse:
      type: object
      properties:
        success:
          type: boolean
        url:
          type: string
        total:
          type: integer
        links:
          type: array
          items:
            type: string
      required:
        - success
        - url
        - total
        - links

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
      required:
        - success
        - error
