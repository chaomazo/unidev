[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unidev"
version = "0.1.0"
description = "A focused toolkit for organizing playable game projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GNU AGPLv3" }
authors = [{ name = "Unidev contributors" }]
dependencies = []

[project.scripts]
unidev = "unidev.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
